<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: min(90vw, 340px);
      padding: 24px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.1);
    }

    input {
      padding: 12px 14px;
      border: 1px solid #d8dce3;
      border-radius: 8px;
      font-size: 1rem;
    }

    button {
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #4338ca;
    }

    submit-message {
      display: block;
      margin-top: 12px;
      font-size: 0.9rem;
      color: #4f46e5;
    }
  </style>
</head>
<body>
  <form action="/submit" method="POST">
    <input type="text" name="name" id="name" placeholder="Enter your name">
    <input type="text" name="email" id="email" placeholder="Enter your email">
    <button type="submit">Submit</button>
  </form>
</body>
</html>
